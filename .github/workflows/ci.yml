name: ci

# Per-PR CI for the SDK. Fast, fixtures-only — NEVER needs the hosted control plane.
# Runs unit + the redaction golden-vector suite + the OTLP contract test (emitted record vs
# contracts/golden-otlp-call.json).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions-minutes budget: without this, pushing three times to a branch runs three full
# pipelines to completion — nothing supersedes anything. Cancel only on pull_request, so every
# commit on main keeps its own verdict instead of "cancelled".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Verify DCO sign-off on PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-merges: DCO certifies AUTHORED contributions, and a merge commit
          # introduces none — it only joins two histories whose own commits this
          # loop already checks. Without the flag the gate is unsatisfiable by
          # construction: a merge made with GitHub's own "Update branch" button
          # is authored by GitHub and can never carry a trailer, so bringing main
          # into a long-running branch (the standard remedy for a stale or
          # conflicted PR) permanently reds the check, and the only way back is a
          # force-push. Every commit a human wrote is still checked; this matches
          # what the upstream DCO app does. Residual, stated so it is not a
          # surprise: an "evil merge" that carries content present in neither
          # parent would now skip the check — narrow, and visible in review.
          missing=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  # Every Node line the package claims, not just the one a developer happens to run.
  # `engines.node` is `^20.16.0 || >=22.3.0`: 20.16.0 and 22.3.0 are the two floors
  # (the first releases with `process.getBuiltinModule`), 22 and 24 are the LTS lines,
  # and 23 is what this job ran alone until the MCP preload turned out to be silently
  # broken on 24 with every check here green. The lines differ where it matters to
  # this SDK: whether `require(esm)` exists, and whether an ESM entry point starts
  # before a `--require` preload's pending `import()` settles. So every leg runs the
  # whole suite, integration specs included.
  test-node:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a red on one line must not hide the verdict on the others
      matrix:
        node: ['20.16.0', '22.3.0', '22', '23', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - run: corepack enable
      - run: yarn install --immutable
      # Once, not per line: what eslint reports does not depend on the runtime, and
      # eslint's own `engines` starts above the floors, where it could red a leg for
      # a reason that has nothing to do with this package.
      - if: matrix.node == '24'
        run: yarn lint
      - run: yarn build   # tsc -b — lint+test never type-build the emitted output, so a @types/node
                          # or typescript major can break `yarn build` with CI fully green.
      - run: yarn test    # unit + redaction vectors + cross-language parity fixtures + zero-network sentinel +
                          # OTLP contract test + the pack manifest (test/packaging.spec.ts) + README floor

  # The required status checks are named `test` and `smoke`. A matrix renames its
  # legs, so these jobs keep those names and pass only when every leg passed.
  test:
    needs: test-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-node.result }}" = success

  smoke-node:
    # A STRANGER'S FIRST RUN. `yarn test` asserts what `yarn pack` would list;
    # this asserts the tarball, once installed into a scratch app with no source
    # tree and no workspace links, actually resolves `@flanj/sdk/register`,
    # captures a call and flushes it before the process exits — on every line.
    name: smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.16.0', '22.3.0', '22', '23', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - run: corepack enable
      - run: yarn install --immutable
      - run: bash scripts/smoke-pack.sh

  smoke:
    needs: smoke-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.smoke-node.result }}" = success
