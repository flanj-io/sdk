name: ci

# Per-PR CI for the SDK. Fast, fixtures-only — NEVER needs the private control-plane.
# Runs unit + the redaction golden-vector suite + the OTLP contract test (emitted record vs
# contracts/golden-otlp-call.json).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions-minutes budget: without this, pushing three times to a branch runs three full
# pipelines to completion — nothing supersedes anything. Cancel only on pull_request, so every
# commit on main keeps its own verdict instead of "cancelled". (This used to be about the e2e
# dispatch a main push fired; there is none since 2026-09-13.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Verify DCO sign-off on PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-merges: DCO certifies AUTHORED contributions, and a merge commit
          # introduces none — it only joins two histories whose own commits this
          # loop already checks. Without the flag the gate is unsatisfiable by
          # construction: a merge made with GitHub's own "Update branch" button
          # is authored by GitHub and can never carry a trailer, so bringing main
          # into a long-running branch (the standard remedy for a stale or
          # conflicted PR) permanently reds the check, and the only way back is a
          # force-push. Every commit a human wrote is still checked; this matches
          # what the upstream DCO app does. Residual, stated so it is not a
          # surprise: an "evil merge" that carries content present in neither
          # parent would now skip the check — narrow, and visible in review.
          missing=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '23' }
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build   # tsc -b — lint+test never type-build the emitted output, so a @types/node
                          # or typescript major can break `yarn build` with CI fully green.
      - run: yarn test    # unit + redaction vectors + cross-language parity fixtures + zero-network sentinel +
                          # OTLP contract test + the pack manifest (test/packaging.spec.ts) + README floor

  smoke:
    # A STRANGER'S FIRST RUN. `yarn test` asserts what `yarn pack` would list;
    # this asserts the tarball, once installed into a scratch app with no source
    # tree and no workspace links, actually resolves `@flanj/sdk/register`,
    # captures a call and flushes it before the process exits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '23' }
      - run: corepack enable
      - run: yarn install --immutable
      - run: bash scripts/smoke-pack.sh
