name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include real cardholder data, PANs, secrets, or PII**
        in this issue — redact any payloads. Suspected redaction bypasses are security issues: please
        report those privately (see `SECURITY.md`), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v0, or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, OS, how you run it, relevant config.
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs. Redact anything sensitive.
      render: shell
